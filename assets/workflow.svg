<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#90A4AE"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="none"/>

  <!-- connecting arrows along the middle of the step row -->
  <g stroke="#90A4AE" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="210" y1="110" x2="256" y2="110"/>
    <line x1="440" y1="110" x2="486" y2="110"/>
    <line x1="670" y1="110" x2="716" y2="110"/>
    <line x1="900" y1="110" x2="946" y2="110"/>
  </g>

  <!-- step boxes -->
  <!-- 1: pick point -->
  <g>
    <rect x="20" y="40" width="190" height="140" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="115" cy="90" r="20" fill="#1565C0"/>
    <circle cx="115" cy="90" r="6" fill="white"/>
    <path d="M115 78 v-14 M115 116 a4 4 0 1 1 0.01 0" fill="none" stroke="#1565C0" stroke-width="0"/>
    <text x="115" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">Pick a point</text>
    <text x="115" y="160" text-anchor="middle" font-size="12" fill="#37474F">Click the map or</text>
    <text x="115" y="174" text-anchor="middle" font-size="12" fill="#37474F">enter lat / lon</text>
  </g>

  <!-- 2: fetch ERA5 -->
  <g>
    <rect x="256" y="40" width="190" height="140" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <g transform="translate(351,70)">
      <path d="M-22 20 h44 a10 10 0 0 0 0-20 a16 16 0 0 0 -30-6 a14 14 0 0 0 -14 26 z" fill="#1565C0"/>
      <line x1="-10" y1="26" x2="-10" y2="34" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="38" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="26" x2="10" y2="34" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="351" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">Fetch ERA5 T2m</text>
    <text x="351" y="160" text-anchor="middle" font-size="12" fill="#37474F">Open-Meteo or the</text>
    <text x="351" y="174" text-anchor="middle" font-size="12" fill="#37474F">CDS API (hourly)</text>
  </g>

  <!-- 3: daily stats -->
  <g>
    <rect x="486" y="40" width="190" height="140" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <g transform="translate(581,68)" stroke="#1565C0" stroke-width="3" stroke-linecap="round" fill="none">
      <polyline points="-24,26 -12,4 0,18 12,-8 24,10"/>
    </g>
    <text x="581" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">Daily T stats</text>
    <text x="581" y="160" text-anchor="middle" font-size="12" fill="#37474F">Tmax &#183; Tmin &#183; Tmean</text>
    <text x="581" y="174" text-anchor="middle" font-size="12" fill="#37474F">per calendar day</text>
  </g>

  <!-- 4: Ra + Hargreaves -->
  <g>
    <rect x="716" y="40" width="190" height="140" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="811" cy="80" r="20" fill="#2E7D32"/>
    <text x="811" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="white">Ra</text>
    <text x="811" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">Compute ET&#8320;</text>
    <text x="811" y="160" text-anchor="middle" font-size="12" fill="#37474F">Hargreaves&#8211;Samani, from</text>
    <text x="811" y="174" text-anchor="middle" font-size="12" fill="#37474F">Ra, Tmax, Tmin, Tmean</text>
  </g>

  <!-- 5: results -->
  <g>
    <rect x="946" y="40" width="234" height="140" rx="16" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
    <polyline points="966,150 990,120 1015,135 1040,95 1065,110 1090,80 1115,100"
              fill="none" stroke="#F9A825" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1063" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#E65100">Chart + CSV</text>
    <text x="1063" y="160" text-anchor="middle" font-size="12" fill="#37474F">Time series of daily</text>
    <text x="1063" y="174" text-anchor="middle" font-size="12" fill="#37474F">ET&#8320; [mm day&#8315;&#185;]</text>
  </g>

  <!-- caption row -->
  <text x="115" y="220" text-anchor="middle" font-size="12" fill="#78909C">1</text>
  <text x="351" y="220" text-anchor="middle" font-size="12" fill="#78909C">2</text>
  <text x="581" y="220" text-anchor="middle" font-size="12" fill="#78909C">3</text>
  <text x="811" y="220" text-anchor="middle" font-size="12" fill="#78909C">4</text>
  <text x="1063" y="220" text-anchor="middle" font-size="12" fill="#78909C">5</text>

  <text x="600" y="270" text-anchor="middle" font-size="14" fill="#546E7A">
    ET&#8320; = 0.0023 &#215; Ra &#215; (Tmean + 17.8) &#215; &#8730;(Tmax &#8722; Tmin)   &#8212;   the Hargreaves&#8211;Samani equation
  </text>
  <text x="600" y="296" text-anchor="middle" font-size="13" fill="#90A4AE">
    Hargreaves is the first method supported &#8212; the pipeline is built to add more (e.g. Penman&#8211;Monteith) later.
  </text>
</svg>
